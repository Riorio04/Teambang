<title>Road to the Crown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@600;700;800&display=swap">
<style>
/* Layout: a 1080x1920 vertical reel stage (phone-first), scaled to fit, with a play/scrub bar under it. One dark broadcast look on purpose. */
:root {
  --ink: #090d1b;
  --panel: #151d38;
  --line: #2c3866;
  --text: #f3f5fc;
  --muted: #9aa6c9;
  --team-a: #3fd0e0;
  --team-b: #ffbe3d;
  --team-c: #ff4f7b;
  --tie: #c2a8ff;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Inter", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--body); padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.player { width: min(100%, calc((100vh - 150px) * 9 / 16)); min-width: min(100%, 300px); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.stage-wrap { position: relative; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; border-radius: 14px; background: var(--ink); border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: var(--ink); --g: #ffbe3d; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(9, 13, 27, .45); border: 0; cursor: pointer; z-index: 20; }
.cover span { font: 800 20px/1 var(--body); color: var(--ink); background: var(--team-b); padding: 16px 24px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.cover:focus-visible span { outline: 3px solid var(--text); outline-offset: 3px; }
.controls { display: flex; align-items: center; gap: 10px; }
.btn { font: 700 15px/1 var(--body); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--team-b); outline-offset: 2px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--team-b); }
.time { font: 600 13px/1 var(--body); font-variant-numeric: tabular-nums; color: var(--muted); }

body.render { padding: 0; }
body.render .player { width: 1080px; min-width: 0; gap: 0; }
body.render .stage-wrap { width: 1080px; height: 1920px; aspect-ratio: auto; border: 0; border-radius: 0; }
body.render .controls, body.render .cover { display: none; }

/* ---------- stage furniture ---------- */
.glow { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 46%, color-mix(in srgb, var(--g) 26%, transparent) 0%, transparent 62%), radial-gradient(700px 500px at 50% 100%, #1d2147 0%, transparent 70%); }
.stripes { position: absolute; inset: -400px; background: repeating-linear-gradient(-60deg, rgba(255,255,255,.03) 0 3px, transparent 3px 60px); }
.tags { position: absolute; top: 120px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 6; }
.tag { background: #fff; color: #0b0f1d; font: 800 54px/1 var(--body); padding: 14px 26px 16px; border-radius: 12px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.tag.sm { font-size: 40px; padding: 10px 22px 12px; }
.tag svg { width: 50px; height: 40px; }
.scene { position: absolute; left: 50px; right: 50px; top: 360px; height: 1020px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; visibility: hidden; }
.row { display: flex; align-items: center; justify-content: center; gap: 36px; }
.mega { font: 900 280px/.9 var(--display); letter-spacing: -.01em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.huge { font: 900 170px/.92 var(--display); text-transform: uppercase; }
.big  { font: 800 120px/.95 var(--display); text-transform: uppercase; }
.mid  { font: 800 88px/1 var(--display); text-transform: uppercase; }
.lab  { font: 800 60px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ta { color: var(--team-a); } .tb { color: var(--team-b); } .tc { color: var(--team-c); } .tt { color: var(--tie); } .tm { color: var(--muted); }
.pill { font: 800 64px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; padding: 16px 30px; border-radius: 14px; }
.pill.live { border: 6px solid var(--team-c); color: var(--team-c); }
.pill.blive { border: 6px solid var(--team-b); color: var(--team-b); }
.stamp { font: 900 120px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--team-c); border: 10px solid var(--team-c); border-radius: 18px; padding: 6px 34px 10px; transform: rotate(-7deg); background: rgba(9,13,27,.8); }
.stamp.final { color: var(--text); border-color: var(--text); }

.shield { clip-path: polygon(50% 0, 100% 22%, 100% 70%, 50% 100%, 0 70%, 0 22%); display: grid; place-items: center; font-family: var(--display); font-weight: 900; color: var(--ink); flex: none; }
.shield.L { width: 300px; height: 340px; font-size: 210px; }
.shield.M { width: 220px; height: 250px; font-size: 156px; }
.shield.S { width: 150px; height: 170px; font-size: 106px; }
.shield.XS { width: 104px; height: 118px; font-size: 74px; }
.s-a { background: linear-gradient(160deg, #a2f0f7, var(--team-a) 55%, #1d8d9b); }
.s-b { background: linear-gradient(160deg, #ffe6a8, var(--team-b) 55%, #bd7c0e); }
.s-c { background: linear-gradient(160deg, #ffadc2, var(--team-c) 55%, #a8204a); }
.vs { font: 900 110px/1 var(--display); color: var(--muted); }
.slots { display: flex; gap: 22px; }
.slot { width: 200px; height: 120px; border-radius: 16px; border: 5px dashed var(--line); display: grid; place-items: center; font: 800 54px/1 var(--display); color: var(--muted); }
.slot.fa { background: var(--team-a); border: 0; color: var(--ink); }
.slot.fb { background: var(--team-b); border: 0; color: var(--ink); }
.slot.fc { background: var(--team-c); border: 0; color: var(--ink); }

.trow { width: 940px; display: grid; grid-template-columns: 150px 1fr 200px; align-items: center; gap: 30px; padding: 22px 40px; background: var(--panel); border: 3px solid var(--line); border-radius: 22px; }
.trow .n { font: 900 150px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.trow .nm { font: 800 96px/1 var(--display); text-transform: uppercase; text-align: left; }
.trow.dim { opacity: .55; }
.champ { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.champ svg { width: 300px; height: 220px; filter: drop-shadow(0 0 40px var(--cc)); }
.champ .huge { color: var(--cc); }
.need { width: 960px; display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 34px; text-align: left; padding: 28px 36px; border-radius: 24px; background: var(--panel); border: 4px solid var(--cc); }
.need .mid { line-height: 1.02; }

.caption { position: absolute; left: 60px; right: 60px; top: 1440px; min-height: 240px; display: flex; align-items: flex-start; justify-content: center; z-index: 7; }
.cap { position: absolute; left: 0; right: 0; text-align: center; font: 800 70px/1.18 var(--body); visibility: hidden; text-wrap: balance; }
.cap .w { display: inline-block; margin: 0 .12em; color: #fff; text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,.9); -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
.cap .w.kb { color: var(--team-b); } .cap .w.kc { color: var(--team-c); } .cap .w.ka { color: var(--team-a); }
.prog { position: absolute; left: 60px; right: 60px; top: 1735px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; z-index: 6; }
.prog i { position: absolute; inset: 0; transform-origin: 0 50%; background: var(--team-b); }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#scenes { position: absolute; inset: 0; z-index: 3; }
#fx b { position: absolute; left: 540px; top: 900px; width: 22px; height: 34px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .stripes { display: none; } }
</style>

</div>

    const d = document.createElement('section'); d.className = 'scene'; d.id = 'sc-' + sc.id;
    d.innerHTML = SCENES[sc.id].html.join(''); scenesEl.appendChild(d);
    sc.phrases.forEach((p, i) => {
      const c = document.createElement('div'); c.className = 'cap'; c.id = 'cap-' + sc.id + '-' + i;
      const words = p.text.split(' ');
      c.innerHTML = words.map((w, j) => '<span class="w ' + teamWord(w, j ? words[j - 1] : '') + '">' + w + '</span>').join(' ');
      capEl.appendChild(c);
    });
  });

  /* ---------- timeline ---------- */
  const tl = gsap.timeline({ paused: true });
  const last = TIMING[TIMING.length - 1];
  const END = last.t + last.d + 0.4;
  tl.fromTo('#stripes', { x: 0 }, { x: -600, duration: END, ease: 'none' }, 0);
  tl.fromTo('#progBar', { scaleX: 0 }, { scaleX: 1, duration: END, ease: 'none' }, 0);
  tl.from('#tag1', { y: -60, autoAlpha: 0, filter: 'blur(16px)', duration: .6, ease: 'power3.out' }, 0);
  tl.from('#tag2', { y: -40, autoAlpha: 0, filter: 'blur(16px)', duration: .6, ease: 'power3.out' }, .15);

  const FX = {
    blur:  { autoAlpha: 0, scale: 1.25, filter: 'blur(26px)', duration: .55, ease: 'power3.out' },
    pop:   { autoAlpha: 0, scale: .4, duration: .6, ease: 'back.out(1.9)' },
    up:    { autoAlpha: 0, y: 120, duration: .55, ease: 'power3.out' },
    stamp: { autoAlpha: 0, scale: 2.6, duration: .4, ease: 'back.out(1.3)' }
  };
  // deterministic confetti
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const fx = $('#fx');
  function confetti(at, color) {
    const cols = [color, '#ffffff', '#ffbe3d', color];
    for (let i = 0; i < 48; i++) {
      const b = document.createElement('b'); b.style.background = cols[i % cols.length]; fx.appendChild(b);
      const ang = rnd() * Math.PI * 2, sp = 380 + rnd() * 520;
      const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp - 300;
      tl.set(b, { autoAlpha: 1, x: 0, y: 0, rotate: 0 }, at);
      tl.to(b, { x: dx, duration: 1.8, ease: 'power2.out' }, at);
      tl.to(b, { keyframes: [{ y: dy, duration: .7, ease: 'power2.out' }, { y: dy + 900, duration: 1.1, ease: 'power1.in' }] }, at);
      tl.to(b, { rotate: (rnd() - .5) * 1080, duration: 1.8, ease: 'none' }, at);
      tl.to(b, { autoAlpha: 0, duration: .4 }, at + 1.4);
    }
    gsap.set(fx.children, { autoAlpha: 0 });
  }

  TIMING.forEach((sc, si) => {
    const def = SCENES[sc.id], node = $('#sc-' + sc.id);
    const start = sc.t, end = sc.t + sc.d;
    tl.addLabel(sc.id, start);
    tl.to('.stage', { '--g': def.accent.replace(/var\((--[\w-]+)\)/, (m, v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()), duration: .6 }, start);
    tl.set(node, { visibility: 'visible', autoAlpha: 1, scale: 1, filter: 'blur(0px)' }, start);
    $$('[data-p]', node).forEach(e => {
      const p = sc.phrases[+e.dataset.p];
      tl.from(e, { ...FX[e.dataset.fx] }, Math.max(start + .05, p.t - .12));
    });
    if (def.confetti != null) confetti(sc.phrases[def.confetti].t + .2, def.accent.includes('team-c') ? '#ff4f7b' : def.accent.includes('tie') ? '#c2a8ff' : '#ffbe3d');
    if (si < TIMING.length - 1) {
      tl.to(node, { autoAlpha: 0, scale: .92, filter: 'blur(18px)', duration: .3, ease: 'power2.in' }, end - .3);
      tl.set(node, { visibility: 'hidden' }, end);
    }
    // captions: words pop in across each phrase
    sc.phrases.forEach((p, i) => {
      const cap = $('#cap-' + sc.id + '-' + i), ws = $$('.w', cap);
      const nextT = i < sc.phrases.length - 1 ? sc.phrases[i + 1].t : end;
      tl.set(cap, { visibility: 'visible' }, p.t - .05);
      const chars = ws.map(w => w.textContent.length + 1), total = chars.reduce((a, b) => a + b, 0);
      let acc = 0;
      ws.forEach((w, j) => {
        tl.from(w, { autoAlpha: 0, y: 30, scale: .7, duration: .18, ease: 'back.out(2)' }, p.t - .05 + p.d * .92 * (acc / total));
        acc += chars[j];
      });
      tl.set(cap, { visibility: 'hidden' }, nextT - .02);
    });
  });
  tl.to({}, { duration: .01 }, END);
  // make scene visibility start hidden at t=0
  gsap.set('.scene', { visibility: 'hidden' });
  gsap.set('.cap', { visibility: 'hidden' });
  tl.seek(0);

  window.__duration = END;
  window.__seek = s => { tl.pause(); tl.seek(s, false); };
  if (RENDER) return;

  /* ---------- player with narration ---------- */
  const vo = $('#vo'), play = $('#play'), scrub = $('#scrub'), time = $('#time'), cover = $('#cover');
  scrub.max = END;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let playing = false, clock = 0, last0 = 0, useAudio = true, atRest = true;
  function now() { return useAudio && !vo.paused ? vo.currentTime : clock; }
  function frame(ts) {
    if (playing) {
      if (!useAudio || vo.paused) clock += (ts - last0) / 1000;
      last0 = ts;
      const t = Math.min(now(), END);
      tl.seek(t, false);
      if (t >= END) stop();
    }
    scrub.value = tl.time(); time.textContent = fmt(tl.time()) + ' / ' + fmt(END);
    requestAnimationFrame(frame);
  }
  function start() {
    playing = true; cover.hidden = true; play.textContent = 'Pause'; last0 = performance.now();
    if (atRest || tl.time() >= END - .05) { atRest = false; tl.seek(0, false); }
    clock = tl.time(); vo.currentTime = clock;
    vo.play().then(() => { useAudio = true; }).catch(() => { useAudio = false; });
  }
  function stop() { playing = false; vo.pause(); clock = tl.time(); play.textContent = 'Play'; }
  play.addEventListener('click', () => playing ? stop() : start());
  cover.addEventListener('click', start);
  scrub.addEventListener('input', () => { atRest = false; tl.seek(+scrub.value, false); clock = +scrub.value; if (playing) vo.currentTime = clock; });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); play.click(); } });
  // resting frame: the opening scene fully built
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { tl.seek(TIMING[0].t + TIMING[0].d - .4, false); clock = 0; });
  requestAnimationFrame(frame);
})();
</script>
