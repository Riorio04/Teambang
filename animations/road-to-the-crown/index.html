<title>Road to the Crown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: 1080x1920 vertical reel. A laptop in a dark room shows each idea on its screen (big type), with a desk reflection and a typed caption beneath. Single dark room look on purpose; the screen itself switches light / dark / orange. */
:root {
  --room: #060709;
  --line: #2a2c33;
  --text: #f4f4f2;
  --muted: #8b8e98;
  --a: #3fd0e0;
  --b: #ffbe3d;
  --c: #ff4f7b;
  --tie: #b89cff;
  --orange: #ef6f43;
  --heavy: "Archivo", "Arial Black", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--room); color: var(--text); }
body { font-family: var(--mono); padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.player { width: min(100%, calc((100vh - 150px) * 9 / 16)); min-width: min(100%, 300px); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.stage-wrap { position: relative; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; border-radius: 14px; background: var(--room); border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: radial-gradient(1100px 900px at 50% 38%, #15171d 0%, var(--room) 70%); --glow: #f1f0ec; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6, 7, 9, .4); border: 0; cursor: pointer; z-index: 20; }
.cover span { font: 800 18px/1 var(--mono); color: #111; background: var(--orange); padding: 16px 22px; border-radius: 999px; }
.cover:focus-visible span { outline: 3px solid var(--text); outline-offset: 3px; }
.controls { display: flex; align-items: center; gap: 10px; }
.btn { font: 700 14px/1 var(--mono); color: var(--text); background: #14161b; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--orange); }
.time { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
body.render { padding: 0; }
body.render .player { width: 1080px; min-width: 0; gap: 0; }
body.render .stage-wrap { width: 1080px; height: 1920px; aspect-ratio: auto; border: 0; border-radius: 0; }
body.render .controls, body.render .cover { display: none; }

/* ---------- room ---------- */
.head { position: absolute; top: 150px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
.head b { font: 800 46px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.head span { font: 500 32px/1 var(--mono); color: var(--muted); }
.desk { position: absolute; left: 0; right: 0; top: 1000px; bottom: 0; background: linear-gradient(#0d0e12, #050608 60%); }
.spill { position: absolute; left: 90px; right: 90px; top: 960px; height: 420px; background: radial-gradient(50% 45% at 50% 18%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 75%); filter: blur(20px); }
.rig { position: absolute; left: 0; right: 0; top: 345px; display: flex; justify-content: center; perspective: 2200px; z-index: 3; }
.laptop { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 100%; -webkit-box-reflect: below 2px linear-gradient(transparent 52%, rgba(255,255,255,.22)); }
.lid { width: 1004px; height: 644px; padding: 22px; border-radius: 30px 30px 8px 8px; background: #0a0a0b; border: 3px solid #2b2c31; box-shadow: 0 0 140px -20px color-mix(in srgb, var(--glow) 40%, transparent); }
.screen { position: relative; width: 954px; height: 594px; border-radius: 10px; overflow: hidden; background: #111; }
.base { width: 1076px; height: 30px; background: linear-gradient(#cfd0d4, #8d8f96 60%, #4a4b50); clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%); border-radius: 0 0 14px 14px; position: relative; }
.base::after { content: ""; position: absolute; left: 44%; right: 44%; top: 0; height: 9px; background: #6e7076; border-radius: 0 0 8px 8px; }

/* ---------- screen scenes ---------- */
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 30px; visibility: hidden; background: var(--bg); color: var(--fg); }
.t-L { --bg: #f1f0ec; --fg: #121316; --mut: #6b6d75; --ta: #0a98ab; --tb: #cf8300; --tc: #dc2f5a; --tt: #6e4ff0; --acc: #e5602f; }
.t-D { --bg: #111216; --fg: #f4f4f2; --mut: #8b8e98; --ta: #3fd0e0; --tb: #ffbe3d; --tc: #ff4f7b; --tt: #c2a8ff; --acc: #ff7a4d; }
.t-O { --bg: #ef6f43; --fg: #141210; --mut: #5e2611; --ta: #053f47; --tb: #fff4d0; --tc: #5c0620; --tt: #24125e; --acc: #141210; }
.ta { color: var(--ta); } .tb { color: var(--tb); } .tc { color: var(--tc); } .tt { color: var(--tt); } .tm { color: var(--mut); } .acc { color: var(--acc); }
.mega { font: 900 200px/.86 var(--heavy); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big  { font: 900 104px/.95 var(--heavy); letter-spacing: -.02em; }
.mid  { font: 900 70px/1 var(--heavy); letter-spacing: -.01em; }
.ser  { font: italic 400 96px/1 var(--serif); }
.ser.s { font-size: 74px; }
.lab  { font: 700 34px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
.row { display: flex; align-items: center; justify-content: center; gap: 30px; }
.tile { border-radius: 28px; display: grid; place-items: center; font-family: var(--heavy); font-weight: 900; color: #111; flex: none; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); }
.tile.L { width: 180px; height: 180px; font-size: 128px; }
.tile.M { width: 140px; height: 140px; font-size: 100px; border-radius: 24px; }
.tile.S { width: 100px; height: 100px; font-size: 70px; border-radius: 18px; }
.tile.XS { width: 76px; height: 76px; font-size: 54px; border-radius: 14px; }
.k-a { background: var(--a); } .k-b { background: var(--b); } .k-c { background: var(--c); }
.t-O .tile { outline: 5px solid #141210; }
.vs { font: italic 400 80px/1 var(--serif); color: var(--mut); }
.slots { display: flex; gap: 18px; }
.slot { width: 150px; height: 84px; border-radius: 14px; border: 4px dashed var(--mut); display: grid; place-items: center; font: 800 40px/1 var(--mono); color: var(--mut); }
.slot.f { border: 0; color: #111; }
.pill { font: 800 40px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; padding: 14px 24px; border-radius: 12px; border: 4px solid currentColor; }
.stamp { font: 900 92px/1 var(--heavy); text-transform: uppercase; color: var(--fg); border: 9px solid var(--fg); border-radius: 16px; padding: 4px 28px 10px; transform: rotate(-6deg); }
.trow { width: 760px; display: grid; grid-template-columns: 100px 1fr 140px; align-items: center; gap: 30px; text-align: left; }
.trow .nm { font: 900 76px/1 var(--heavy); }
.trow .n { font: 900 110px/1 var(--heavy); text-align: right; font-variant-numeric: tabular-nums; }
.need { width: 820px; display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 30px; text-align: left; }
.champ { display: flex; align-items: center; gap: 26px; }
.champ svg { width: 140px; height: 108px; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stat b { font: 900 170px/.9 var(--heavy); }
.dots i { display: inline-block; width: 18px; height: 18px; margin-left: 10px; border-radius: 50%; background: var(--mut); }
.mag { position: absolute; width: 240px; height: 240px; left: 140px; top: 130px; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
#fx b { position: absolute; left: 477px; top: 300px; width: 16px; height: 26px; border-radius: 3px; }

/* ---------- typed caption ---------- */
.caption { position: absolute; left: 70px; right: 70px; top: 1420px; height: 260px; z-index: 6; }
.cap { position: absolute; left: 0; right: 0; top: 0; font: 700 54px/1.3 var(--mono); color: var(--text); text-align: center; visibility: hidden; }
.cap i { font-style: normal; display: none; }
.cap i.ka { color: var(--a); } .cap i.kb { color: var(--b); } .cap i.kc { color: var(--c); }
.cur { display: inline-block; width: .6em; height: 1.05em; margin-left: 4px; vertical-align: -.16em; background: var(--orange); }
@media (prefers-reduced-motion: reduce) { .laptop { transform: none !important; } }
</style>

  <audio id="vo" src="narration.mp3" preload="auto"></audio>
</div>

      el(need('C', 'beats B <span class="tc">twice</span>'), 2, 'up'),
      el('<div class="mega"><span class="tb">4</span><span class="tt">=</span><span class="tc">4</span></div>', 3, 'pop') ] },
    h2h:   { th: 'D', confetti: [1, '#b89cff'], html: [
      el('<div class="ser tt">head-to-head</div>', 0),
      el(VS('B', 'C', 'L'), 0, 'pop'),
      el(champ('X', 'winner takes it', 'tt mid'), 1, 'pop') ] },
    sum:   { th: 'L', html: [
      el('<div class="lab">so here’s the thing</div>', 0),
      el(need('B', 'needs <span class="tb">1 more win</span>'), 1, 'up'),
      el(need('C', 'must beat B <span class="tc">twice</span>'), 2, 'up'),
      el(need('A', '<span class="ta">decides</span> how hard'), 3, 'up') ] },
    end:   { th: 'O', html: [
      el('<div class="ser">so…</div>', 0),
      el('<div class="big">who takes<br>the crown?</div>', 1, 'pop') ] }
  };

  /* ---------- DOM ---------- */
  const screen = $('#screen'), capEl = $('#caption');
  const teamKey = (w, prev) => { const k = w.replace(/[^A-Za-z]/g, ''); if (k === 'B' || k === 'C') return 'k' + k.toLowerCase(); if (k === 'A' && prev) return 'ka'; return ''; };
  TIMING.forEach(sc => {
    const d = document.createElement('section'); d.className = 'scene t-' + SCENES[sc.id].th; d.id = 'sc-' + sc.id;
    d.innerHTML = SCENES[sc.id].html.join('') + (SCENES[sc.id].mag != null ? MAG : '');
    screen.insertBefore(d, $('#fx'));
    sc.phrases.forEach((p, i) => {
      const c = document.createElement('div'); c.className = 'cap'; c.id = 'cap-' + sc.id + '-' + i;
      const words = p.text.split(' ');
      const word = (w, j) => { const k = teamKey(w, j > 0); return Array.from(w).map(ch => '<i class="' + k + '">' + ch + '</i>').join(''); };
      c.innerHTML = words.slice(0, -1).map(word).map(h => h + '<i> </i>').join('') + '<span style="white-space:nowrap">' + word(words[words.length - 1], words.length - 1) + '<span class="cur"></span></span>';
      capEl.appendChild(c);
    });
  });

  /* ---------- timeline ---------- */
  const tl = gsap.timeline({ paused: true });
  const last = TIMING[TIMING.length - 1];
  const END = last.t + last.d + 0.6;
  const FX = {
    blur:  { autoAlpha: 0, scale: 1.18, filter: 'blur(22px)', duration: .5, ease: 'power3.out' },
    pop:   { autoAlpha: 0, scale: .45, duration: .55, ease: 'back.out(1.8)' },
    up:    { autoAlpha: 0, y: 90, duration: .5, ease: 'power3.out' },
    stamp: { autoAlpha: 0, scale: 2.4, duration: .38, ease: 'back.out(1.3)' }
  };
  tl.from('#head', { autoAlpha: 0, y: -30, filter: 'blur(12px)', duration: .8, ease: 'power3.out' }, 0);
  tl.from('#laptop', { autoAlpha: 0, y: 80, rotateX: 18, duration: 1.1, ease: 'power3.out' }, 0);
  gsap.set('.cur', { opacity: 1 });
  tl.to('.cur', { opacity: 0, duration: .42, ease: 'steps(1)', repeat: Math.ceil(END / .42), yoyo: true }, 0);

  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const fx = $('#fx');
  function confetti(at, color) {
    const cols = [color, '#ffffff', color, '#111111'];
    for (let i = 0; i < 44; i++) {
      const b = document.createElement('b'); b.style.background = cols[i % 4]; fx.appendChild(b); gsap.set(b, { autoAlpha: 0 });
      const ang = rnd() * Math.PI * 2, sp = 260 + rnd() * 380, dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp * .7 - 200;
      tl.set(b, { autoAlpha: 1, x: 0, y: 0, rotate: 0 }, at);
      tl.to(b, { x: dx, rotate: (rnd() - .5) * 900, duration: 1.7, ease: 'power2.out' }, at);
      tl.to(b, { keyframes: [{ y: dy, duration: .6, ease: 'power2.out' }, { y: dy + 700, duration: 1.1, ease: 'power1.in' }] }, at);
      tl.set(b, { autoAlpha: 0 }, at + 1.7);
    }
  }
  const GLOW = { L: '#f1f0ec', D: '#4a5068', O: '#ef6f43' };
  // camera: slow drift, a new angle per scene
  const ANG = [[-4, 3], [3, 2], [-2, 4], [4, 2.5], [-3, 3.5], [2, 2], [-4, 2.5], [3, 4]];

  TIMING.forEach((sc, si) => {
    const def = SCENES[sc.id], node = $('#sc-' + sc.id);
    const start = sc.t, end = sc.t + sc.d, a = ANG[si % ANG.length];
    tl.addLabel(sc.id, start);
    tl.to('#laptop', { rotateY: a[0], rotateX: a[1], scale: 1 + (si % 3) * .015, duration: sc.d + .3, ease: 'sine.inOut' }, start - .2);
    tl.to('.stage', { '--glow': GLOW[def.th], duration: .4 }, start);
    tl.set(node, { visibility: 'visible' }, start - .02);
    tl.fromTo(node, { autoAlpha: 0, scale: 1.06, filter: 'blur(14px)' }, { autoAlpha: 1, scale: 1, filter: 'blur(0px)', duration: .35, ease: 'power2.out', immediateRender: false }, start - .02);
    if (si < TIMING.length - 1) tl.set(node, { visibility: 'hidden' }, TIMING[si + 1].t + .4);
    $$('[data-p]', node).forEach(e => {
      if (e.dataset.fx === 'none') return;
      const p = sc.phrases[+e.dataset.p];
      tl.from(e, { ...FX[e.dataset.fx] }, Math.max(start + .08, p.t - .1));
    });
    const mag = $('[data-mag]', node);
    if (mag) { const p = sc.phrases[def.mag]; tl.fromTo(mag, { x: -160, y: 120, rotate: -20, autoAlpha: 0 }, { keyframes: [{ x: 0, y: 0, rotate: 0, autoAlpha: 1, duration: .5 }, { x: 420, y: -20, rotate: 8, duration: 1.4, ease: 'sine.inOut' }, { x: 200, y: 10, rotate: 0, duration: .9, ease: 'sine.inOut' }] }, p.t + .2); }
    const dots = $$('[data-dots] i', node);
    dots.forEach((d, i) => tl.fromTo(d, { y: 0 }, { y: -16, duration: .3, yoyo: true, repeat: Math.floor((end - start) / .6), ease: 'sine.inOut' }, start + .1 * i));
    if (def.confetti) confetti(sc.phrases[def.confetti[0]].t + .25, def.confetti[1]);

    // typed caption
    sc.phrases.forEach((p, i) => {
      const cap = $('#cap-' + sc.id + '-' + i), chars = $$('i', cap);
      const nextT = i < sc.phrases.length - 1 ? sc.phrases[i + 1].t : (si < TIMING.length - 1 ? TIMING[si + 1].phrases[0].t : END);
      tl.set(cap, { visibility: 'visible' }, p.t - .06);
      const span = Math.min(p.d * .85, chars.length * .06);
      chars.forEach((ch, j) => tl.set(ch, { display: 'inline' }, p.t - .06 + span * (j / chars.length)));
      tl.set(cap, { visibility: 'hidden' }, nextT - .08);
    });
  });
  tl.to({}, { duration: .01 }, END);
  tl.seek(0);

  window.__duration = END;
  window.__seek = s => { tl.pause(); tl.seek(s, false); };
  if (RENDER) return;

  /* ---------- player with narration ---------- */
  const vo = $('#vo'), play = $('#play'), scrub = $('#scrub'), time = $('#time'), cover = $('#cover');
  scrub.max = END;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let playing = false, clock = 0, last0 = 0, useAudio = true, atRest = true;
  function frame(ts) {
    if (playing) {
      if (!useAudio || vo.paused) clock += (ts - last0) / 1000; else clock = vo.currentTime;
      last0 = ts;
      const t = Math.min(clock, END);
      tl.seek(t, false);
      if (t >= END) stop();
    }
    scrub.value = tl.time(); time.textContent = fmt(tl.time()) + ' / ' + fmt(END);
    requestAnimationFrame(frame);
  }
  function start() {
    if (atRest || tl.time() >= END - .05) { atRest = false; tl.seek(0, false); }
    playing = true; cover.hidden = true; play.textContent = 'Pause'; last0 = performance.now();
    clock = tl.time(); vo.currentTime = clock;
    vo.play().then(() => { useAudio = true; }).catch(() => { useAudio = false; });
  }
  function stop() { playing = false; vo.pause(); clock = tl.time(); play.textContent = 'Play'; }
  play.addEventListener('click', () => playing ? stop() : start());
  cover.addEventListener('click', start);
  scrub.addEventListener('input', () => { atRest = false; tl.seek(+scrub.value, false); clock = +scrub.value; if (playing) vo.currentTime = clock; });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); play.click(); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { tl.seek(TIMING[0].t + TIMING[0].d - .3, false); });
  requestAnimationFrame(frame);
})();
</script>
